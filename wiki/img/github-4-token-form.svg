ght="400" fill="#59636e" text-anchor="start">Type / to search</text><rect x="760" y="58" width="34" height="28" rx="6" fill="#fff" stroke="#aab3bd" stroke-width="1" /><text x="777" y="77" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#59636e" text-anchor="middle">+</text><circle cx="826" cy="72" r="15" fill="#9aa4af"/><circle cx="826" cy="68.7" r="5.3999999999999995" fill="#fff"/><path d="M816.7 83.7 Q826 72.75 835.3 83.7 Z" fill="#fff"/><text x="40" y="130" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="start">New personal access token (classic)</text><line x1="40" y1="144" x2="840" y2="144" stroke="#d1d9e0" stroke-width="1"/><text x="40" y="176" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Note</text><rect x="40" y="186" width="360" height="34" rx="6" fill="#fff" stroke="#aab3bd" stroke-width="1" /><text x="52" y="208.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">RepoFoundry</text><text x="40" y="238" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">What’s this token for?</text><rect x="36" y="182" width="368" height="42" rx="8" fill="rgba(209,36,47,0.07)" stroke="#d1242f" stroke-width="3" /><circle cx="22" cy="203" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="22" y="208" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="40" y="274" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Expiration</text><rect x="40" y="284" width="190" height="34" rx="6" fill="#fff" stroke="#aab3bd" stroke-width="1" /><text x="52" y="306.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">30 days</text><polygon points="209,298.5 219,298.5 214,304.5" fill="#59636e"/><text x="246" y="306" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The token will expire on the date shown here.</text><rect x="36" y="280" width="198" height="42" rx="8" fill="rgba(209,36,47,0.07)" stroke="#d1242f" stroke-width="3" /><circle cx="22" cy="301" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="22" y="306" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="40" y="356" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Select scopes</text><rect x="40" y="366" width="800" height="232" rx="8" fill="#fff" stroke="#d1d9e0" stroke-width="1" /><rect x="58" y="380" width="16" height="16" rx="3" fill="#0969da" /><path d="M61.5 388.5 L64.8 391.8 L70.5 384.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="393" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">repo</text><text x="150" y="393" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Full control of private repositories</text><rect x="84" y="404" width="16" height="16" rx="3" fill="14" /><path d="M87.5 412.5 L90.8 415.8 L96.5 408.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="416" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">repo:status</text><rect x="205" y="404" width="16" height="16" rx="3" fill="14" /><path d="M208.5 412.5 L211.8 415.8 L217.5 408.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="416" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">repo_deployment</text><rect x="354" y="404" width="16" height="16" rx="3" fill="14" /><path d="M357.5 412.5 L360.8 415.8 L366.5 408.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="416" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">public_repo</text><rect x="475" y="404" width="16" height="16" rx="3" fill="14" /><path d="M478.5 412.5 L481.8 415.8 L487.5 408.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495" y="416" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">repo:invite</text><rect x="596" y="404" width="16" height="16" rx="3" fill="14" /><path d="M599.5 412.5 L602.8 415.8 L608.5 408.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="616" y="416" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">security_events</text><line x1="40" y1="432" x2="840" y2="432" stroke="#eef1f4" stroke-width="1"/><rect x="58" y="442" width="16" height="16" rx="3" fill="#fff" stroke="#d1d9e0" stroke-width="1.5" /><text x="84" y="455" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">workflow</text><text x="180" y="455" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8c959f" text-anchor="start">Update GitHub Action workflows</text><rect x="58" y="470" width="16" height="16" rx="3" fill="#fff" stroke="#d1d9e0" stroke-width="1.5" /><text x="84" y="483" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">write:packages</text><text x="210" y="483" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8c959f" text-anchor="start">Upload packages to GitHub Package Registry</text><line x1="40" y1="502" x2="840" y2="502" stroke="#eef1f4" stroke-width="1"/><rect x="58" y="512" width="16" height="16" rx="3" fill="#fff" stroke="#d1d9e0" stroke-width="1.5" /><text x="84" y="525" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">admin:org</text><text x="180" y="525" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8c959f" text-anchor="start">Full control of orgs and teams, read and write org projects</text><rect x="84" y="538" width="14" height="14" rx="3" fill="#fff" stroke="#d1d9e0" stroke-width="1.5" /><text x="106" y="550" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">write:org</text><rect x="190" y="538" width="14" height="14" rx="3" fill="#fff" stroke="#d1d9e0" stroke-width="1.5" /><text x="212" y="550" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">read:org</text><text x="300" y="550" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d1242f" text-anchor="start">← only if the script says you are not in the organization</text><text x="58" y="584" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">(the other scopes stay unticked)</text><rect x="52" y="374" width="780" height="62" rx="8" fill="rgba(209,36,47,0.07)" stroke="#d1242f" stroke-width="3" /><circle cx="22" cy="405" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="22" y="410" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="40" y="622" width="140" height="36" rx="6" fill="#1f883d" /><text x="110.0" y="644.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Generate token</text><rect x="192" y="622" width="80" height="36" rx="6" fill="#f6f8fa" stroke="#c5ccd4" stroke-width="1" /><text x="232.0" y="644.9" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Cancel</text><rect x="36" y="618" width="148" height="44" rx="8" fill="rgba(209,36,47,0.07)" stroke="#d1242f" stroke-width="3" /><circle cx="22" cy="640" r="13" fill="#d1242f" stroke="#fff" stroke-width="2"/><text x="22" y="645" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" 