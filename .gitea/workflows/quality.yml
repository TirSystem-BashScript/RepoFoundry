name: Quality

# Shell checks (shellcheck, shfmt) with the shared reusable workflow of
# TirSystem/github-action. It changes no file and needs no secret. The release
# workflow requires this run to be green on the commit it releases.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    permissions:
      contents: read
    uses: TirSystem/github-action/.gitea/workflows/quality-checks.yml@v1.1.0
    with:
      languages: shell
      # Pinned to the same tag as the workflow, so the whole check is fixed.
      tools-ref: v1.1.0
